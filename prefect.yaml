---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: flood-pipeline
prefect-version: 3.6.28

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /home/keima/projects/flood-pipeline

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: daily-rainfall
  version: null
  tags: [daily, rainfall]
  description: null
  schedule: 
    cron: "0 1 * * *"
    timezone: "Asia/Jakarta"
  flow_name: null
  entrypoint: dags/flows.py:flow_daily_rainfall
  parameters: {}
  work_pool:
    name: default-agentpool
- name: daily-flood-events
  entrypoint: dags/flows.py:flow_daily_flood_events
  work_pool:
    name: default-agentpool
  schedule:
    cron: "0 2 * * *"
    timezone: "Asia/Jakarta"
  tags: [daily, flood-events]

- name: monthly-static
  entrypoint: dags/flows.py:flow_monthly_static
  work_pool:
    name: default-agentpool
  schedule:
    cron: "0 3 1 * *"
    timezone: "Asia/Jakarta"
  tags: [monthly, static]

- name: full-pipeline
  entrypoint: dags/flows.py:flow_full_pipeline
  work_pool:
    name: default-agentpool
  schedule: null
  tags: [manual]
